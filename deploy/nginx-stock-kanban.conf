# Nginx 反向代理配置
# 将此文件放在: /etc/nginx/sites-available/stock-kanban

upstream stock_kanban_api {
    server localhost:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;  # 替换为你的域名或 EC2 IP

    # 日志
    access_log /var/log/nginx/stock_kanban_access.log;
    error_log /var/log/nginx/stock_kanban_error.log;

    # 请求体大小限制
    client_max_body_size 10M;

    # 前端静态文件 (Vite 构建输出)
    location / {
        root /home/ubuntu/stock_kanban/dist/public;
        try_files $uri $uri/ /index.html;

        # 缓存设置
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # 不缓存 HTML
    location = /index.html {
        root /home/ubuntu/stock_kanban/dist/public;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://stock_kanban_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 支持 (如果需要)
    location /socket.io {
        proxy_pass http://stock_kanban_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查端点
    location /health {
        access_log off;
        proxy_pass http://stock_kanban_api;
    }
}
