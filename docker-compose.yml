version: '3.8'

services:
  stock-kanban-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-kanban-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    expose:
      - 3000
    networks:
      - caddy-net
    restart: unless-stopped
    healthcheck:
      # 使用 Node.js 原生 http 模块进行检查，兼容性最强
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/watchlists', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy-net:
    external: true
